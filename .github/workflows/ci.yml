name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint (erreurs réelles seulement — pas de style)
        # E9/F63/F7/F82 = erreurs de syntaxe, comparaisons cassées, code
        # inatteignable, variables non définies. On ne bloque pas la CI
        # pour du style (lignes trop longues, etc.), seulement pour de
        # vrais bugs.
        run: ruff check . --select=E9,F63,F7,F82

  tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run detector tests (security_core.py)
        run: python test_security_core.py

      - name: Run Splunk forwarder tests (mocked, no live Splunk needed)
        run: python test_splunk_forwarder.py

      - name: Generate TLS certificate for the monitoring server
        run: python generate_cert.py

      - name: Start monitoring server in background
        run: |
          echo "AGENT_AUTH_TOKEN=ci-test-token" > .env
          python server.py > server.log 2>&1 &
          sleep 3

      - name: Run monitoring test suite (17 tests)
        run: python test_suite.py

      - name: Show server logs on failure
        if: failure()
        run: cat server.log
